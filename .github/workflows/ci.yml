name: ci

# The check every PR needs before it can merge: `pnpm test`, accessibility
# (pa11y-ci) and Lighthouse CI, on every commit of a PR and every push to main.
# On a PR, only the steps the changed files need run (checks.yml). The steps
# are in checks.yml, so the check keeps the name `ci / ci` that the ruleset of
# main requires. The job lighthouse-comment then posts the Lighthouse results
# on the PR. Deploys nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  # The Lighthouse results as a comment on the PR, kept up to date on every
  # commit (docs/quality-checks.md). Not part of the required check. It runs no
  # code from the PR, only posts the table checks.yml left in the artifact.
  # Skipped for PRs from forks, whose token cannot write.
  lighthouse-comment:
    needs: ci
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: quality-reports
          path: reports

      - name: Comment on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          RESULT: ${{ needs.ci.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker='<!-- lighthouse-report -->'
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -f reports/lighthouse.md ]; then
            body=$(cat reports/lighthouse.md)
          elif [ -z "$id" ]; then
            echo "Lighthouse did not run and there is no comment to update."
            exit 0
          elif [ "$RESULT" = success ]; then
            body='Lighthouse did not run on this commit: it changes no page Lighthouse checks (scripts/ci-scope.mjs).'
          else
            body='Lighthouse did not run on this commit: an earlier step of `ci / ci` failed.'
          fi
          {
            echo "$marker"
            case "$body" in "### "*) ;; *) printf '### Lighthouse\n\n' ;; esac
            echo "$body"
            echo
            printf 'Commit %s, `ci / ci`: %s. The full reports are in the artifact `quality-reports` of [the run](%s).\n' "${SHA:0:7}" "$RESULT" "$RUN_URL"
          } > comment.md
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@comment.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md > /dev/null
          fi
