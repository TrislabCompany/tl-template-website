name: Deploy to staging

# Deploys the newest release, the highest tag vX.Y.Z, to staging: after every
# successful Release new version, and by hand. It records the tag as a GitHub
# deployment of staging, which Promote to production reads
# (docs/deployment.md).

on:
  workflow_run:
    workflows: [Release new version]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  latest:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Find the newest release
        id: latest
        run: echo "version=$(node scripts/version.mjs latest)" | tee -a "$GITHUB_OUTPUT"

  deploy:
    needs: latest
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/pages-deploy.yml
    with:
      environment: staging
      version: ${{ needs.latest.outputs.version }}
      source: release
    secrets: inherit
