name: Set up Node and pnpm
description: Node 22, pnpm at the version in packageManager of package.json, and the dependencies from the lock file.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22
        package-manager-cache: false

    # pnpm comes from Corepack, at the version in packageManager.
    - name: Install pnpm and the dependencies
      shell: bash
      env:
        COREPACK_ENABLE_DOWNLOAD_PROMPT: 0
        ASTRO_TELEMETRY_DISABLED: 1
      run: |
        corepack enable
        corepack install --global "$(jq -r .packageManager package.json)"
        pnpm install --frozen-lockfile
