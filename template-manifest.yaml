# Every path of this template and its ownership (docs/template-releases.md).
# update-from-template reads this file at the template release it updates to:
#   platform       copied over the product's file on every update; the product never edits it
#   shared         the template's change is 3-way merged into the product's file; conflicts are listed
#   product        never touched; the template's change is shown as a suggestion
#   template-only  never copied to a product repository; `pnpm init-site` deletes it
#   sample         the template's sample content: shown in the template, deleted by `pnpm init-site`,
#                  never copied to a product repository (docs/template-releases.md)
# The first rule whose pattern matches a path wins. `*` matches within one folder, `**` across folders.
# So the rules of a narrower class come before `.github/workflows/*`, `scripts/**`, `src/**` and the others.
# `pnpm test` fails when a tracked file matches no rule (scripts/check-template-manifest.mjs).
template: template-website

# The template's skills, in .agents/skills/<name>/. Any other folder there is a project skill,
# which an update never reads, changes or deletes. Each skill's front matter repeats its ownership.
# Each skill also has a pointer, .claude/skills/<name>/SKILL.md, with the same front matter:
# Claude Code finds skills only there. It has the skill's ownership.
skills:
  release: platform
  update-from-template: platform
  release-template: template-only

paths:
  # Maintaining the template itself
  - { path: template-manifest.yaml, ownership: template-only }
  # The init script and its input: `pnpm init-site` runs once, in the repository's first PR, and removes them
  - { path: site.schema.json, ownership: template-only }
  - { path: site.yaml, ownership: template-only }
  - { path: scripts/init-site.mjs, ownership: template-only }
  - { path: scripts/init-site.test.mjs, ownership: template-only }
  - { path: scripts/init/**, ownership: template-only }
  - { path: .agents/skills/release-template/**, ownership: template-only }
  - { path: .claude/skills/release-template/**, ownership: template-only }
  - { path: docs/template-releases.md, ownership: template-only }
  - { path: docs/upgrading/template-*.md, ownership: template-only }
  - { path: .github/workflows/template-release.yml, ownership: template-only }
  - { path: .github/workflows/template-init.yml, ownership: template-only }

  # The sample content: it makes the template a working site, and is deleted at init.
  # A site's own lists are written by init-site from `collections` in site.yaml.
  - { path: src/content/services/**, ownership: sample }

  # The platform's part: the same in every product repository, never edited there.
  # The workflows and the deploy-time scripts are what the release process rests on.
  - { path: .github/workflows/*, ownership: platform }
  - { path: .github/actions/**, ownership: platform }
  - { path: .agents/skills/release/**, ownership: platform }
  - { path: .agents/skills/update-from-template/**, ownership: platform }
  - { path: .claude/skills/release/**, ownership: platform }
  - { path: .claude/skills/update-from-template/**, ownership: platform }
  - { path: docs/upgrading/README.md, ownership: platform }
  - { path: CLAUDE.md, ownership: platform }
  - { path: renovate.json, ownership: platform }
  - { path: scripts/write-config.mjs, ownership: platform }
  - { path: scripts/write-config.test.mjs, ownership: platform }
  - { path: scripts/version.mjs, ownership: platform }
  - { path: scripts/version.test.mjs, ownership: platform }
  - { path: scripts/status.mjs, ownership: platform }
  - { path: scripts/check-template-manifest.mjs, ownership: platform }
  - { path: scripts/check-template-manifest.test.mjs, ownership: platform }

  # The product's own from the first day
  - { path: README.md, ownership: product }
  - { path: .github/CODEOWNERS, ownership: product }
  - { path: pnpm-lock.yaml, ownership: product }
  - { path: src/**, ownership: product }
  - { path: docs/brief.md, ownership: product }
  - { path: docs/co2/**, ownership: product }

  # Shared: the template's starting point, which the product may adapt.
  # public/_headers is shared, not product: the Content-Security-Policy needs
  # an origin added when the site loads something from outside.
  - { path: public/_headers, ownership: shared }
  - { path: public/**, ownership: product }
  - { path: AGENTS.md, ownership: shared }
  - { path: .agents/rules/**, ownership: shared }
  - { path: .github/pull_request_template.md, ownership: shared }
  - { path: docs/**, ownership: shared }
  - { path: scripts/**, ownership: shared }
  - { path: .editorconfig, ownership: shared }
  - { path: .gitattributes, ownership: shared }
  - { path: .gitignore, ownership: shared }
  - { path: .pa11yci.json, ownership: shared }
  - { path: lighthouserc.json, ownership: shared }
  - { path: astro.config.mjs, ownership: shared }
  - { path: eslint.config.js, ownership: shared }
  - { path: tsconfig.json, ownership: shared }
  - { path: package.json, ownership: shared }
  - { path: page-weight.config.json, ownership: shared }
