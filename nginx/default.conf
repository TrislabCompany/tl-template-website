# The site's nginx configuration: routing, security headers, caching, and the
# health paths the stamp probes. Keep /healthz, /readyz, /config.json and the
# headers when you change it.

# Hashed assets under /_astro/ never change, so the browser keeps them for a
# year. Every other file is checked again on each visit.
map $uri $cache_control {
    ~^/_astro/      "public, max-age=31536000, immutable";
    /config.json    "no-store";
    default         "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header Cache-Control $cache_control always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # /about is about/index.html; anything else that isn't a file is the
    # site's 404 page.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;

    # Written at container start by docker-entrypoint.d/40-config.sh.
    location = /config.json {
        alias /usr/share/nginx/config/config.json;
        default_type application/json;
    }

    # nginx serves the files itself, so it is alive and ready as soon as it
    # answers.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /readyz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
