# yaml-language-server: $schema=./platform.schema.json
# The image this repository builds and the sizing of its app, within the
# stamp's caps. ci / ci checks it on every PR. Raising a cap is a change to the
# stamp, not to this file (docs/deployment.md).
images:
  web: { dockerfile: Dockerfile }
apps:
  web:
    image: web
    profile: Consumption
    cpu: 0.25
    memory: 0.5Gi
    min_replicas: 0
    max_replicas: 2
